<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mohit Panchal — Work Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;padding:28px 20px;}
.wrap{max-width:1100px;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.header h1{font-size:20px;font-weight:700;}
.header-sub{font-size:13px;color:#64748b;margin-top:3px;}
.header-right{text-align:right;}
.ts{font-size:12px;color:#94a3b8;}
.live-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#16a34a;font-weight:600;margin-top:4px;}
.live-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:#16a34a;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.refresh-bar{height:2px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px;}
.refresh-prog{height:100%;background:#6366f1;border-radius:999px;transition:width .3s linear;}
.card{background:white;border-radius:12px;padding:18px 22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8eef4;}
.stitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:14px;}
.status-bar{display:grid;grid-template-columns:1fr auto auto auto;gap:16px;align-items:center;margin-bottom:14px;background:white;border-radius:12px;padding:14px 22px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8eef4;}
.cap-mini{display:flex;flex-direction:column;gap:4px;}
.cap-mini .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;}
.cap-mini .bar-row{display:flex;align-items:center;gap:10px;}
.cap-mini .pct{font-size:22px;font-weight:800;}
.cap-bar-track{background:#f1f5f9;border-radius:999px;height:8px;overflow:hidden;width:140px;}
.cap-bar{height:100%;border-radius:999px;transition:width .6s ease;}
.stat-chip{text-align:center;padding:6px 16px;border-radius:8px;}
.stat-chip .sv{font-size:18px;font-weight:700;}
.stat-chip .sl{font-size:10px;font-weight:600;margin-top:1px;}
.item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #f1f5f9;}
.item:last-child{border-bottom:none;}
.item-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:700;}
.item-main{flex:1;min-width:0;}
.item-title{font-size:14px;font-weight:500;color:#1e293b;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-meta{font-size:12px;color:#94a3b8;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.src-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
.tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.p-high{color:#ef4444;font-weight:600;}
.p-med{color:#f59e0b;font-weight:600;}
.p-low{color:#10b981;font-weight:600;}
.qitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;}
.qitem:last-child{border-bottom:none;}
.qkey{font-size:11px;font-weight:700;color:#6366f1;white-space:nowrap;min-width:62px;}
.qtitle{flex:1;font-size:13px;font-weight:500;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ditem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;}
.ditem:last-child{border-bottom:none;}
.dcheck{width:16px;height:16px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;color:#16a34a;font-weight:700;}
.dtitle{flex:1;font-size:12px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dtime{font-size:10px;color:#94a3b8;white-space:nowrap;}
.grid2{display:flex;flex-direction:column;gap:14px;}
.empty{text-align:center;padding:20px;color:#94a3b8;font-size:13px;}
@media(max-width:720px){.grid2,.status-bar{grid-template-columns:1fr;}.cap-bar-track{width:80px;}.item-title{white-space:normal;}}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <div>
    <h1>Mohit Panchal &middot; Work Dashboard</h1>
    <div class="header-sub">AI Solutions &amp; Automations &middot; WKT</div>
  </div>
  <div class="header-right">
    <div class="ts">Updated: <span id="lastUpdated">-</span></div>
    <div class="live-dot">Live &middot; every 3h</div>
    <div class="refresh-bar"><div class="refresh-prog" id="prog" style="width:100%"></div></div>
  </div>
</div>
<div class="status-bar">
  <div class="cap-mini">
    <div class="label">Capacity</div>
    <div class="bar-row">
      <div class="pct" id="capPct">-</div>
      <div>
        <div class="cap-bar-track"><div class="cap-bar" id="capBar"></div></div>
        <div style="font-size:10px;color:#94a3b8;margin-top:2px;" id="capSub"></div>
      </div>
    </div>
  </div>
  <div class="stat-chip" id="chipWorkflows" style="background:#ede9fe;">
    <div class="sv" style="color:#7c3aed;" id="workflowCount">-</div>
    <div class="sl" style="color:#7c3aed;">Active Automations</div>
  </div>
  <div class="stat-chip" id="chipSuccess" style="background:#dcfce7;">
    <div class="sv" style="color:#16a34a;" id="successCount">-</div>
    <div class="sl" style="color:#16a34a;">Ran today</div>
  </div>
  <div class="stat-chip" id="chipErrors" style="background:#fee2e2;">
    <div class="sv" style="color:#dc2626;" id="errorCount">-</div>
    <div class="sl" style="color:#dc2626;">Failed today</div>
  </div>
</div>
<div class="card">
  <div class="stitle" id="activeTitle">Active Work</div>
  <div id="activeList"><div class="empty">Loading&hellip;</div></div>
</div>
<div class="grid2">
  <div class="card">
    <div class="stitle" id="queueTitle">Queue / Incoming</div>
    <div id="queueList"><div class="empty">Loading&hellip;</div></div>
  </div>
  <div class="card">
    <div class="stitle" id="doneTitle">Completed &mdash; Last 14 Days</div>
    <div id="doneList"><div class="empty">Loading&hellip;</div></div>
  </div>
</div>
</div>

<script>
var DATA_URL = 'https://n8n.sandbox.it.weknowtraining.ca/webhook/work-dashboard-data';
var REFRESH_MS = 3 * 60 * 60 * 1000; // 3 hours
var MAX_ACTIVE = 8;

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function timeAgo(iso) {
  var diff = Date.now() - new Date(iso).getTime();
  var d = Math.floor(diff / 86400000);
  if (d === 0) {
    var h = Math.floor(diff / 3600000);
    if (h === 0) { var m = Math.floor(diff / 60000); return m < 2 ? 'just now' : m + 'm ago'; }
    return h + 'h ago';
  }
  return d === 1 ? 'yesterday' : d + 'd ago';
}

function getType(labels, summary) {
  var t = (labels || []).join(' ').toLowerCase() + ' ' + (summary || '').toLowerCase();
  if (/\bai\b|chatbot|model|predict|nlp|gpt|llm|classif|sentiment/.test(t)) return {label:'AI Solution',color:'#7c3aed',bg:'#ede9fe'};
  if (/automat|n8n|sync|pipeline|workflow|bot|integrat|trigger/.test(t)) return {label:'Automation',color:'#1d4ed8',bg:'#dbeafe'};
  if (/report|dashboard|power.?bi|analytics|visuali|kpi/.test(t)) return {label:'Report',color:'#166634',bg:'#dcfce7'};
  return {label:'Other',color:'#475569',bg:'#f1f5f9'};
}

function getPriority(p) {
  var lp = (p || 'Medium').toLowerCase();
  if (/high|critical|urgent|highest/.test(lp)) return {label:'High',css:'p-high'};
  if (/low|minor|lowest/.test(lp)) return {label:'Low',css:'p-low'};
  return {label:'Medium',css:'p-med'};
}

function renderActiveItem(item) {
  var icon, iconBg, srcBadge, srcBg, srcColor, meta = '', right = '';
  if (item.source === 'claude') {
    icon = '&#9733;'; iconBg = '#ede9fe';
    srcBadge = item.entryType === 'manual' ? 'MANUAL LOG' : 'CLAUDE AUTO';
    srcBg = '#ede9fe'; srcColor = '#6d28d9';
    meta = '<span style="font-weight:500;color:#7c3aed;">' + esc(item.project) + '</span>';
    if (item.filesChanged) meta += '<span>' + esc(item.filesChanged.split(',').slice(0,3).join(', ')) + '</span>';
    right = '<span style="font-size:11px;color:#94a3b8;">' + timeAgo(item.timestamp) + '</span>';
  } else {
    var ty = getType(item.labels, item.title);
    var pr = getPriority(item.priority);
    icon = '&#9632;'; iconBg = '#dbeafe'; srcBadge = 'JIRA'; srcBg = '#dbeafe'; srcColor = '#1d4ed8';
    meta = '<span style="font-weight:600;color:#6366f1;">' + esc(item.key) + '</span>';
    meta += '<span class="' + pr.css + '">&#9679; ' + pr.label + '</span>';
    meta += '<span class="tag" style="background:' + ty.bg + ';color:' + ty.color + ';">' + ty.label + '</span>';
    right = '';
  }
  return '<div class="item">' +
    '<div class="item-icon" style="background:' + iconBg + ';color:' + srcColor + '">' + icon + '</div>' +
    '<div class="item-main"><div class="item-title">' + esc(item.title) + '</div><div class="item-meta">' + meta + '</div></div>' +
    '<div class="item-right"><span class="src-badge" style="background:' + srcBg + ';color:' + srcColor + ';">' + srcBadge + '</span>' + right + '</div>' +
    '</div>';
}

function render(data) {
  var items = data.activeItems || [];
  var queue = data.queueIssues || [];
  var done = data.doneIssues || [];
  var health = data.n8nHealth || {};
  var max = data.maxActive || MAX_ACTIVE;

  var jiraActive = items.filter(function(i) { return i.source === 'jira'; }).length;
  var pct = Math.min(100, Math.round((jiraActive / max) * 100));
  var capColor = pct <= 50 ? '#16a34a' : pct <= 80 ? '#d97706' : '#dc2626';
  document.getElementById('capPct').textContent = pct + '%';
  document.getElementById('capPct').style.color = capColor;
  document.getElementById('capSub').textContent = jiraActive + ' / ' + max + ' ticket slots';
  var bar = document.getElementById('capBar');
  bar.style.width = pct + '%'; bar.style.background = capColor;

  document.getElementById('workflowCount').textContent = health.activeWorkflowCount != null ? health.activeWorkflowCount : '-';
  document.getElementById('successCount').textContent = health.successToday != null ? health.successToday : '-';
  var ec = health.errorToday != null ? health.errorToday : null;
  document.getElementById('errorCount').textContent = ec != null ? ec : '-';
  var chipErr = document.getElementById('chipErrors');
  chipErr.style.background = (ec > 0) ? '#fee2e2' : '#f0fdf4';
  chipErr.querySelector('.sv').style.color = (ec > 0) ? '#dc2626' : '#16a34a';
  chipErr.querySelector('.sl').style.color = (ec > 0) ? '#dc2626' : '#16a34a';

  document.getElementById('activeTitle').textContent = 'Active Work (' + items.length + ')';
  document.getElementById('activeList').innerHTML = items.length
    ? items.map(renderActiveItem).join('')
    : '<div class="empty">Nothing active right now &#8212; inbox zero!</div>';

  document.getElementById('queueTitle').textContent = 'Queue / Incoming (' + queue.length + ')';
  var qH = queue.length ? queue.slice(0,10).map(function(i) {
    var pr = getPriority((i.fields && i.fields.priority || {}).name);
    return '<div class="qitem"><div class="qkey">' + esc(i.key) + '</div><div class="qtitle">' + esc(i.fields && i.fields.summary || i.title || '') + '</div><span class="' + pr.css + '" style="font-size:11px;white-space:nowrap;">&#9679; ' + pr.label + '</span></div>';
  }).join('') : '<div class="empty">Queue is empty</div>';
  if (queue.length > 10) qH += '<div style="text-align:center;padding:6px;font-size:12px;color:#94a3b8;">+' + (queue.length - 10) + ' more</div>';
  document.getElementById('queueList').innerHTML = qH;

  document.getElementById('doneTitle').textContent = 'Completed — Last 14 Days (' + done.length + ')';
  var dH = done.length ? done.slice(0,10).map(function(i) {
    var ty = getType(i.fields && i.fields.labels || [], i.fields && i.fields.summary || i.title || '');
    return '<div class="ditem"><div class="dcheck">&#10003;</div><div class="dtitle">' + esc(i.fields && i.fields.summary || i.title || '') + '</div><span class="tag" style="background:' + ty.bg + ';color:' + ty.color + ';font-size:10px;">' + ty.label + '</span><div class="dtime">' + timeAgo(i.fields && i.fields.updated || i.updated || new Date().toISOString()) + '</div></div>';
  }).join('') : '<div class="empty">No completions yet</div>';
  document.getElementById('doneList').innerHTML = dH;

  var d = new Date(data.lastUpdated || Date.now());
  document.getElementById('lastUpdated').textContent = d.toLocaleTimeString('en-CA', {hour:'2-digit',minute:'2-digit',hour12:true});
}

function fetchData() {
  fetch(DATA_URL, {headers: {Accept: 'application/json'}})
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d) { render(d); })
    .catch(function(e) { console.error('[Dashboard] fetch error:', e); });
}

fetchData();
setInterval(fetchData, REFRESH_MS);

// Countdown bar (visual only)
var countdown = REFRESH_MS / 1000;
setInterval(function() {
  countdown--;
  document.getElementById('prog').style.width = ((countdown / (REFRESH_MS / 1000)) * 100) + '%';
  if (countdown <= 0) countdown = REFRESH_MS / 1000;
}, 1000);
</script>
</body>
</html>
